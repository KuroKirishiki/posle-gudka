<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100f0f"><title>После гудка • Survival horror</title><meta name="description" content="Найди сестру в городе, который перестал отвечать. Пиксельный survival horror, записки, головоломки и ограниченный рюкзак."><link rel="stylesheet" href="style.css"></head><body>
<div id="shell"><header><a href="#" id="brand" aria-label="Главное меню">ПОСЛЕ ГУДКА<span>ТИШИНА НЕ ОЗНАЧАЕТ БЕЗОПАСНОСТЬ</span></a><div class="header-right"><span id="clock">23:17 / НОВОЗАРЕЧЬЕ</span><button id="sound" aria-label="Переключить звук">ЗВУК: ВКЛ</button><button id="pause" aria-label="Пауза">Ⅱ</button></div></header>
<main id="stage"><canvas id="game" width="960" height="600" tabindex="0" aria-label="Игровое поле. WASD — движение, E — взаимодействие, мышь — прицел, левая кнопка — атака, I — рюкзак, M — карта."></canvas><div class="scanlines"></div><div id="room-label"><span id="chapter">01 / ЖИЛОЙ КВАРТАЛ</span><b id="location">УЛИЦА ЛЕСНАЯ</b></div><div id="hud"><div><span id="health-label">СОСТОЯНИЕ</span><div id="healthbar"><i></i></div><small id="health">100 / 100</small></div><div class="weapon"><b id="weapon">МОНТИРОВКА</b><span id="ammo">БЛИЖНИЙ БОЙ</span></div><div id="stamina"><i></i></div></div><div id="prompt"></div><div id="toast" role="status"></div><div id="modal" class="hidden" role="dialog" aria-modal="true" aria-label="Игровое меню"></div><div id="touch"><div class="dpad"><button data-key="w">▲</button><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><div class="actions"><button data-act="aim">ПРИЦЕЛ</button><button data-act="attack">АТАКА</button><button data-act="interact">E</button><button data-act="inventory">РЮКЗАК</button></div></div></main>
<footer><div id="objective"><span>ЦЕЛЬ</span> Найти квартиру Ани</div><nav><button id="inventory">I <span>РЮКЗАК</span></button><button id="journal">J <span>ЗАПИСКИ</span></button><button id="map">M <span>КАРТА</span></button><button id="equip">Q <span>ОРУЖИЕ</span></button></nav></footer></div>
<script src="world.js"></script><script src="game.js"></script></body></html>
